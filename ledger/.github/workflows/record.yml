name: record
# Every hour: fetch the app server's public snapshot, append new recommendations / results to the hash chain,
# verify the whole chain, and commit. The commit time is GitHub's independent timestamp for each line.
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions: { contents: write, issues: write }
concurrency: { group: ledger, cancel-in-progress: false }
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: fetch snapshots (gold + crypto; the free server may need a minute to wake up)
        env:
          URL: ${{ vars.SNAPSHOT_URL || 'https://gold-ai-quant.onrender.com/public/snapshot' }}
        run: |
          for a in XAU BTC ETH SOL; do
            for i in 1 2 3 4; do
              curl -fsS --max-time 120 "$URL?asset=$a" -o "snap_$a.json" && break
              rm -f "snap_$a.json"; sleep 30
            done
            [ -s "snap_$a.json" ] || echo '{}' > "snap_$a.json"
          done
      - run: python3 ledger.py update snap_XAU.json snap_BTC.json snap_ETH.json snap_SOL.json
      - run: python3 ledger.py verify
      - name: health monitor (one open issue while something is wrong -> e-mail to the owner)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 monitor.py snap_XAU.json snap_BTC.json snap_ETH.json snap_SOL.json | tee monitor.txt
          open=$(gh issue list --state open --label alert --json number -q '.[0].number' 2>/dev/null || true)
          if grep -q '^ALERT' monitor.txt; then
            body=$(printf "Automatic check at %s UTC\n\n%s\n\nThis issue closes itself when everything is healthy again." "$(date -u +%F\ %H:%M)" "$(grep '^ALERT' monitor.txt | sed 's/^ALERT /- /')")
            gh label create alert --color B60205 2>/dev/null || true
            if [ -z "$open" ]; then gh issue create --title "AI QUANT alert" --label alert --body "$body"
            fi  # already open: no hourly repeat e-mails
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All checks healthy again at $(date -u +%F\ %H:%M) UTC."
          fi
      - name: commit
        run: |
          rm -f snapshot.json snap_*.json
          git config user.name ai-quant-ledger
          git config user.email ledger@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "ledger: $(date -u +%Y-%m-%dT%H:%MZ) head $(tail -c 80 ledger.jsonl | grep -o '"hash":"[0-9a-f]\{12\}' | cut -d'"' -f4)"
          git push -q
