[project]
name = "goldquant"
version = "0.1.0"
description = "GOLD AI QUANT — XAU/USD research decision engine (signals and paper trading only)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "scikit-learn>=1.4",
  "pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"  # millions of library deprecation warnings made the summary hang CI

[tool.setuptools]
packages = ["goldquant", "goldquant.providers"]
