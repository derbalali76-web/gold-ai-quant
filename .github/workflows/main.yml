name: unzip-project
on:
  push:
    paths:
      - 'gold-ai-quant.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - run: |
          unzip -oq gold-ai-quant.zip
          rm gold-ai-quant.zip
          if [ -d gold-ai-quant ]; then
            cp -a gold-ai-quant/. .
            rm -rf gold-ai-quant
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project" || exit 0
          git push
