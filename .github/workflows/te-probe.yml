name: te-probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2" \
                   "https://www.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2" \
                   "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1" \
                   "https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-$(date -u -d yesterday +%F).zip" \
                   "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=2" \
                   "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=2"; do
            echo "== $u"; curl -s -m 20 -o /tmp/o -w "%{http_code}\n" "$u"; head -c 300 /tmp/o; echo; done
