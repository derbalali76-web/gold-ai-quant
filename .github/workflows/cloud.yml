name: cloud-data-and-models
# Free on GitHub-hosted runners within the monthly minutes of your plan. Hourly collection (~1 min),
# training every 4 h, research daily. The hourly commit also keeps scheduled workflows active.
on:
  schedule:
    - cron: "7 */2 * * *"      # collect (every 2 h: private repo = 2000 free minutes / month)
    - cron: "27 4 * * *"       # train (daily)
    - cron: "47 3 * * 0"       # research (weekly, ~20 min)
    - cron: "37 1 * * *"       # backfill (daily) (3 years, resumes where it stopped; quick once complete)
    - cron: "53 6 * * 1"       # weekly report (opens a GitHub issue → e-mail)
    - cron: "17 2 * * 6"       # crypto: refresh archive data + research (weekly, ~60 min)
  workflow_dispatch:
    inputs:
      job:
        description: "collect | train | research | backfill | report | crypto | crypto_research | touch | range"
        default: "collect"
      years:
        description: "backfill years (Dukascopy)"
        default: "3"
concurrency: { group: cloud-data, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt openpyxl
      - name: choose job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "name=${{ inputs.job }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "27 4 * * *" ]; then echo "name=train" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "47 3 * * 0" ]; then echo "name=research" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "37 1 * * *" ]; then echo "name=backfill" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "53 6 * * 1" ]; then echo "name=report" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "17 2 * * 6" ]; then echo "name=crypto_weekly" >> $GITHUB_OUTPUT
          else echo "name=collect" >> $GITHUB_OUTPUT; fi
      - name: run
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOLDQUANT_REPO_ROOT: ${{ github.workspace }}
        run: timeout 100m python backend/tools/cloud_job.py ${{ steps.job.outputs.name }} --years "${{ inputs.years || '3' }}"
      - name: commit
        if: ${{ always() }}
        run: |
          git config user.name "gold-ai-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          # add each path separately: one missing path (e.g. reports/ before the first report) must not drop the rest
          for p in market_data models reports; do [ -e "$p" ] && git add "$p"; done
          git diff --cached --quiet || git commit -m "data: ${{ steps.job.outputs.name }} $(date -u +%FT%TZ)"
          git push || (git pull --rebase && git push)
      - name: open the weekly report as an issue
        if: ${{ steps.job.outputs.name == 'report' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "Weekly report $(date -u +%F)" --body-file reports/weekly.md || true
      - name: wake the web service
        if: ${{ env.RENDER_URL != '' }}
        env: { RENDER_URL: "${{ secrets.RENDER_URL }}" }
        run: curl -s -m 90 "$RENDER_URL/health" > /dev/null || true
