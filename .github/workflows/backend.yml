name: backend-tests
on:
  push:
    paths: ["backend/**", "ledger/**", "models/range_models.json", "models/hilo_models.json", "schema/**", "android/app/src/test/resources/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
