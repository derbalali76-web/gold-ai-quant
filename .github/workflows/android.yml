name: android-apk
on:
  push:
    paths: ["android/**", "schema/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (parser + URL policy against backend fixtures)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug + release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: APK sizes
        run: ls -la app/build/outputs/apk/*/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gold-ai-quant-apk
          path: android/app/build/outputs/apk/**/*.apk

  ui-tests-on-emulator:
    # Real Compose UI tests on an Android emulator (small/medium/large layouts, RTL, all decision states)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
