name: android-apk
on:
  push:
    paths: ["android/**", "schema/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        continue-on-error: true   # its 'sdkmanager tools' call can fail; the runner already ships an SDK
      - name: Accept SDK licenses (preinstalled SDK)
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests (parser + URL policy against backend fixtures)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug + release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: APK sizes
        run: ls -la app/build/outputs/apk/*/*.apk
      - name: Publish APK as release "Latest APK" (artifact storage quota is full)
        if: ${{ github.ref == 'refs/heads/main' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        working-directory: ${{ github.workspace }}
        run: |
          FILES="android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ls -la $FILES || FILES="$(ls android/app/build/outputs/apk/*/*.apk)"
          gh release view latest-apk >/dev/null 2>&1 || gh release create latest-apk --title "Latest APK" --notes "Latest build" --target "$GITHUB_SHA"
          gh release edit latest-apk --draft=false --latest --notes "Built from ${GITHUB_SHA::7}"
          gh release upload latest-apk $FILES --clobber
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: gold-ai-quant-apk
          path: android/app/build/outputs/apk/**/*.apk

  ui-tests-on-emulator:
    # Real Compose UI tests on an Android emulator (small/medium/large layouts, RTL, all decision states)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}  # manual: saves ~3 min per push on the private repo
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35, 36]   # Android 11, 15, 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
          
